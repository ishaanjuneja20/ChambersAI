<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
const renderer = new THREE.WebGLRenderer();
const ktx2 = new KTX2Loader().setTranscoderPath("/public/basis/").detectSupport(renderer);
const loader = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
function rng(seed){ let s=seed>>>0; return ()=> (s = (s*1664525+1013904223)>>>0)/4294967296; }
function positions(mesh, out){ const v=new THREE.Vector3(); const n=mesh.geometry.attributes.position.count; const a=new Float32Array(n*3); for(let i=0;i<n;i++){ mesh.getVertexPosition(i,v); mesh.localToWorld(v); a[i*3]=v.x;a[i*3+1]=v.y;a[i*3+2]=v.z;} return a; }

    setPose(a,{}); setPose(b,{});
    const ra = positions(ma), rb = positions(o);

    const nb=rb.length/3; const match=new Int32Array(nb).fill(-1); let restMax=0;
    for(let j=0;j<nb;j++){ const cx=Math.round(rb[j*3]/cell),cy=Math.round(rb[j*3+1]/cell),cz=Math.round(rb[j*3+2]/cell); let best=-1,bd=1e9,bp=1e9;
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){ const L=grid.get((cx+dx)+","+(cy+dy)+","+(cz+dz)); if(!L) continue; for(const i of L){ const d0=Math.hypot(ra[i*3]-rb[j*3],ra[i*3+1]-rb[j*3+1],ra[i*3+2]-rb[j*3+2]); const uA=ma.geometry.attributes.uv,uB=o.geometry.attributes.uv; const duv=Math.hypot(uA.getX(i)-uB.getX(j),uA.getY(i)-uB.getY(j)); const nA=ma.geometry.attributes.normal,nB=o.geometry.attributes.normal; const dn=1-(nA.getX(i)*nB.getX(j)+nA.getY(i)*nB.getY(j)+nA.getZ(i)*nB.getZ(j)); const d=d0+10*duv+0.01*dn; if(d<bd){bd=d;best=i;bp=d0;} } }
      match[j]=best; restMax=Math.max(restMax,bp); }

      for(const st of (nm? states : [{name:"none", w:[]}])){
        setPose(a,pose); setPose(b,pose);

        const pa=positions(ma), pb=positions(o); let mx=0, sq=0;
        for(let j=0;j<nb;j++){ const i=match[j]; if(i<0) continue; const d=Math.hypot(pa[i*3]-pb[j*3],pa[i*3+1]-pb[j*3+1],pa[i*3+2]-pb[j*3+2]); if(d>mx) mx=d; sq+=d*d; }

      for(let j=0;j<nb;j++){ const i=match[j]; if(i<0) continue; const va=new THREE.Vector3(na_.getX(i),na_.getY(i),na_.getZ(i)), vb=new THREE.Vector3(nb_.getX(j),nb_.getY(j),nb_.getZ(j));

  });

};
